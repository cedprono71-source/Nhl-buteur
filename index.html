<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NHL GoalScorer Analytics</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-900 min-h-screen font-sans">

    <header class="bg-white border-b border-slate-200 py-4 px-6 sticky top-0 z-50 shadow-sm">
        <div class="max-w-4xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
            <h1 class="text-xl font-extrabold tracking-wider text-red-600 flex items-center gap-2">
                🏒 <span class="text-slate-900">NHL GoalScorer Analytics</span>
            </h1>
            
            <div class="flex items-center gap-2">
                <span class="text-xs font-bold text-slate-500 uppercase">Date :</span>
                <input type="date" id="date-picker" class="bg-slate-50 text-slate-800 font-semibold px-3 py-1.5 rounded-lg border border-slate-300 text-sm focus:outline-none focus:border-red-500 shadow-inner">
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto p-4 sm:p-6">
        <div id="loading" class="text-center py-12 text-slate-500 font-medium">Chargement des matchs de la LNH...</div>
        <div id="matches-container" class="space-y-4"></div>
        <div id="no-matches" class="hidden text-center py-12 text-slate-500 font-medium">Aucun match NHL trouvé pour cette date.</div>
    </main>

    <div id="modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-white border border-slate-200 w-full max-w-2xl rounded-2xl overflow-hidden shadow-2xl flex flex-col max-h-[90vh]">
            
            <div class="p-4 bg-slate-50 border-b border-slate-200 flex justify-between items-center">
                <div id="modal-teams" class="font-bold text-lg text-slate-900">Analyse du Match</div>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-700 text-2xl font-bold px-2">&times;</button>
            </div>

            <div class="p-4 flex-1 overflow-y-auto space-y-4">
                <div class="flex bg-slate-100 p-1 rounded-xl border border-slate-200">
                    <button id="btn-home" onclick="switchModalTab('home')" class="flex-1 py-2 text-sm font-bold rounded-lg bg-red-600 text-white shadow-sm transition">Domicile</button>
                    <button id="btn-away" onclick="switchModalTab('away')" class="flex-1 py-2 text-sm font-bold rounded-lg text-slate-600 hover:text-slate-900 transition">Extérieur</button>
                </div>

                <div id="players-container" class="space-y-3"></div>
            </div>

        </div>
    </div>

    <script>
        let currentMatchData = null;
        let activeModalTab = 'home';

        const todayStr = new Date().toISOString().split('T')[0];
        const datePicker = document.getElementById('date-picker');
        datePicker.value = todayStr;

        datePicker.addEventListener('change', (e) => {
            loadNhlMatches(e.target.value);
        });

        loadNhlMatches(todayStr);

        async function loadNhlMatches(date) {
            const container = document.getElementById('matches-container');
            const loading = document.getElementById('loading');
            const noMatches = document.getElementById('no-matches');

            loading.classList.remove('hidden');
            container.innerHTML = '';
            noMatches.classList.add('hidden');

            try {
                const response = await fetch(`/api/matches/nhl?date=${date}`);
                const data = await response.json();
                loading.classList.add('hidden');

                if (!data.matches || data.matches.length === 0) {
                    noMatches.classList.remove('hidden');
                    return;
                }

                data.matches.forEach(match => {
                    renderMatchCard(container, match.home_team, match.away_team, match.home_logo, match.away_logo, match.game_state);
                });
            } catch (err) {
                loading.classList.add('hidden');
                noMatches.classList.remove('hidden');
            }
        }

        function renderMatchCard(container, home, away, homeLogo, awayLogo, state) {
            const card = document.createElement('div');
            card.className = "bg-white border border-slate-200 rounded-2xl p-4 sm:p-5 flex items-center justify-between shadow-sm hover:shadow-md hover:border-slate-300 transition cursor-pointer";
            card.onclick = () => fetchPrediction(home, away);

            const hLogo = homeLogo || "https://assets.nhle.com/logos/nhl/svg/TOR_light.svg";
            const aLogo = awayLogo || "https://assets.nhle.com/logos/nhl/svg/TOR_light.svg";

            card.innerHTML = `
                <div class="flex items-center gap-4 flex-1 justify-end">
                    <span class="font-bold text-slate-800 text-right text-sm sm:text-base">${home}</span>
                    <img src="${hLogo}" alt="" class="w-12 h-12 sm:w-14 sm:h-14 object-contain drop-shadow">
                </div>
                <div class="px-4 text-center">
                    <span class="text-xs bg-slate-100 text-slate-700 px-3 py-1.5 rounded-full font-mono font-bold border border-slate-200 shadow-xs whitespace-nowrap">${state}</span>
                </div>
                <div class="flex items-center gap-4 flex-1 justify-start">
                    <img src="${aLogo}" alt="" class="w-12 h-12 sm:w-14 sm:h-14 object-contain drop-shadow">
                    <span class="font-bold text-slate-800 text-left text-sm sm:text-base">${away}</span>
                </div>
            `;
            container.appendChild(card);
        }

        async function fetchPrediction(homeTeam, awayTeam) {
            const modal = document.getElementById('modal');
            document.getElementById('modal-teams').innerText = `${homeTeam} vs ${awayTeam}`;
            modal.classList.remove('hidden');
            modal.classList.add('flex');

            const playersContainer = document.getElementById('players-container');
            playersContainer.innerHTML = '<div class="text-center py-8 text-slate-500 font-medium">Calcul des probabilités buteurs (Poisson)...</div>';

            try {
                const response = await fetch('/predict/goalscorers', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ league: "NHL", home_team: homeTeam, away_team: awayTeam })
                });
                
                currentMatchData = await response.json();
                renderPlayers();
            } catch (err) {
                playersContainer.innerHTML = '<div class="text-center py-8 text-red-500 font-medium">Erreur lors de la récupération des données.</div>';
            }
        }

        function switchModalTab(tab) {
            activeModalTab = tab;
            const btnHome = document.getElementById('btn-home');
            const btnAway = document.getElementById('btn-away');

            if (tab === 'home') {
                btnHome.className = "flex-1 py-2 text-sm font-bold rounded-lg bg-red-600 text-white shadow-sm transition";
                btnAway.className = "flex-1 py-2 text-sm font-bold rounded-lg text-slate-600 hover:text-slate-900 transition";
            } else {
                btnAway.className = "flex-1 py-2 text-sm font-bold rounded-lg bg-red-600 text-white shadow-sm transition";
                btnHome.className = "flex-1 py-2 text-sm font-bold rounded-lg text-slate-600 hover:text-slate-900 transition";
            }
            renderPlayers();
        }

        function renderPlayers() {
            if (!currentMatchData) return;
            const container = document.getElementById('players-container');
            container.innerHTML = '';

            const players = activeModalTab === 'home' ? currentMatchData.top_goalscorers_home : currentMatchData.top_goalscorers_away;

            players.forEach(p => {
                const item = document.createElement('div');
                item.className = "bg-slate-50 border border-slate-200 rounded-xl p-3.5 flex items-center justify-between shadow-xs";
                item.innerHTML = `
                    <div>
                        <div class="font-bold text-sm text-slate-900 flex items-center gap-2">
                            ${p.name} <span class="text-xs bg-slate-200 text-slate-700 px-1.5 py-0.5 rounded font-semibold">${p.pos}</span>
                        </div>
                        <div class="text-xs text-slate-500 mt-0.5 font-medium">${p.stats} &bull; <span class="text-slate-700 font-semibold">${p.momentum}</span></div>
                    </div>
                    <div class="text-right">
                        <div class="text-red-600 font-extrabold text-sm">${p.prob}</div>
                        <div class="text-xs text-slate-500 font-medium">Cote ~${p.odds}</div>
                    </div>
                `;
                container.appendChild(item);
            });
        }

        function closeModal() {
            document.getElementById('modal').classList.add('hidden');
            document.getElementById('modal').classList.remove('flex');
        }
    </script>
</body>
</html>
