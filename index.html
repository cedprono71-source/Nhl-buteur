<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f172a">
  <title>NHL GoalScorer Analytics 39.72</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: "class", screens: { xs: "420px", sm: "640px", md: "768px", lg: "1024px", xl: "1280px", "2xl": "1536px" } };
    (function () {
      const saved = localStorage.getItem("gsa-theme");
      const dark = saved ? saved === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.classList.toggle("dark", dark);
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: "Inter", ui-sans-serif, system-ui, sans-serif; }
    .font-display { font-family: "Barlow Condensed", "Inter", sans-serif; }
    button:focus-visible, input:focus-visible {
      outline: 3px solid #f87171;
      outline-offset: 2px;
    }
    .modal-scroll { overscroll-behavior: contain; }
    .modal-scroll::-webkit-scrollbar { width: 6px; }
    .modal-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
    .dark .modal-scroll::-webkit-scrollbar-thumb { background: #334155; }
    @keyframes live-pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.45; }
    }
    .live-dot { animation: live-pulse 1.6s ease-in-out infinite; }
  </style>
</head>
<body class="bg-slate-100 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen font-sans transition-colors">

  <header class="sticky top-0 z-40 border-b border-slate-200 dark:border-slate-800 bg-white/95 dark:bg-slate-950/95 backdrop-blur shadow-sm">
    <div class="h-1 bg-gradient-to-r from-red-600 via-red-500 to-slate-900 dark:to-slate-800"></div>
    <div class="max-w-4xl mx-auto py-2.5 px-3 sm:px-6 flex items-center justify-between gap-2">
      <h1 class="font-display font-extrabold text-lg sm:text-2xl uppercase tracking-wide leading-none min-w-0 truncate">
        <span class="text-red-600">🏒 NHL</span>
        <span class="hidden xs:inline text-slate-900 dark:text-white">GoalScorer</span>
        <span class="hidden sm:inline text-slate-400 dark:text-slate-500">Analytics</span>
      </h1>

      <div class="flex items-center gap-1 sm:gap-1.5 shrink-0">
        <span class="hidden sm:inline-flex items-center text-[10px] font-bold tracking-[0.15em] uppercase bg-slate-900 text-white dark:bg-red-600 rounded-full px-2.5 py-1">39.72</span>
        <label for="date-picker" class="sr-only">Date</label>
        <input type="date" id="date-picker" class="bg-slate-50 dark:bg-slate-900 px-1.5 sm:px-2 py-2 rounded-lg border border-slate-300 dark:border-slate-700 text-xs sm:text-sm dark:text-white">
        <button id="refresh-btn" aria-label="Actualiser" class="bg-slate-900 dark:bg-red-600 text-white w-9 h-9 sm:w-10 sm:h-10 rounded-lg text-base sm:text-lg font-bold leading-none hover:opacity-90 transition">⟳</button>
        <button id="history-btn" aria-label="Historique" class="bg-white dark:bg-slate-900 text-slate-900 dark:text-white w-9 h-9 sm:w-10 sm:h-10 rounded-lg text-base sm:text-lg border border-slate-300 dark:border-slate-700 leading-none hover:border-red-400 transition">📜</button>
        <button id="theme-btn" aria-label="Changer de thème" class="bg-white dark:bg-slate-900 text-slate-700 dark:text-amber-400 w-9 h-9 sm:w-10 sm:h-10 rounded-lg border border-slate-300 dark:border-slate-700 leading-none hover:border-red-400 transition">🌙</button>
      </div>
    </div>
  </header>

  <main class="max-w-4xl mx-auto p-4 sm:p-6">
    <div id="api-status" class="mb-4 text-xs text-slate-500 dark:text-slate-400 text-center">Connexion à l'API…</div>
    <div id="loading" class="text-center py-14">
      <div class="inline-block w-10 h-10 border-4 border-slate-200 dark:border-slate-800 border-t-red-600 rounded-full animate-spin"></div>
      <div class="mt-3 text-slate-500 dark:text-slate-400 font-medium">Chargement des matchs NHL…</div>
    </div>
    <div id="matches-container" class="grid gap-3"></div>
    <div id="no-matches" class="hidden text-center py-12">
      <div class="text-5xl mb-3">🏒</div>
      <div class="text-slate-500 dark:text-slate-400 font-medium"></div>
    </div>
  </main>

  <!-- Fenêtre d'analyse d'un match -->
  <div id="modal" class="fixed inset-0 bg-slate-950/70 backdrop-blur-sm hidden items-center justify-center p-2 sm:p-4 z-50">
    <section class="bg-slate-50 dark:bg-slate-950 w-full max-w-2xl rounded-2xl overflow-hidden shadow-2xl flex flex-col max-h-[94vh] border border-slate-200 dark:border-slate-800">
      <div class="p-4 bg-gradient-to-r from-slate-900 via-slate-800 to-slate-900 flex justify-between items-center gap-3">
        <div class="flex items-center gap-2 sm:gap-3 min-w-0">
          <div id="modal-home-logo-wrap" class="w-10 h-10 sm:w-12 sm:h-12 rounded-full bg-white flex items-center justify-center p-1.5 shrink-0 hidden">
            <img id="modal-home-logo" alt="" class="w-full h-full object-contain">
          </div>
          <div class="min-w-0">
            <div class="text-[10px] text-slate-400 font-bold uppercase tracking-[0.2em] font-display">Analyse du match</div>
            <div id="modal-teams" class="font-display font-bold text-lg sm:text-2xl text-white leading-tight">NHL</div>
          </div>
          <div id="modal-away-logo-wrap" class="w-10 h-10 sm:w-12 sm:h-12 rounded-full bg-white flex items-center justify-center p-1.5 shrink-0 hidden">
            <img id="modal-away-logo" alt="" class="w-full h-full object-contain">
          </div>
        </div>
        <button id="close-modal" aria-label="Fermer" class="text-slate-400 hover:text-white text-3xl leading-none shrink-0">&times;</button>
      </div>

      <div class="p-3 sm:p-4 pb-6 flex-1 overflow-y-auto modal-scroll space-y-4">
        <div id="outcome-banner" class="hidden"></div>
        <div class="rounded-2xl bg-slate-900 dark:bg-black/50 border border-slate-800 p-4 sm:p-5 space-y-4 relative overflow-hidden">
          <div class="absolute inset-x-0 top-0 h-1 bg-gradient-to-r from-red-600 via-red-500 to-slate-700"></div>
          <div class="text-[11px] font-bold uppercase tracking-[0.2em] text-slate-400 font-display pt-1">Pronostics & buts attendus (xG)</div>
          <div class="grid grid-cols-3 items-end text-center">
            <div>
              <div class="text-[10px] uppercase tracking-wider text-slate-400 font-bold">Domicile</div>
              <div id="pred-home-win" class="font-display text-4xl sm:text-5xl font-extrabold text-red-500 leading-none">—</div>
            </div>
            <div>
              <div class="text-[10px] uppercase tracking-wider text-slate-500 font-bold">Prolong.</div>
              <div id="pred-draw" class="font-display text-xl font-bold text-slate-400 leading-none pt-1">—</div>
            </div>
            <div>
              <div class="text-[10px] uppercase tracking-wider text-slate-400 font-bold">Extérieur</div>
              <div id="pred-away-win" class="font-display text-4xl sm:text-5xl font-extrabold text-white leading-none">—</div>
            </div>
          </div>
          <div class="flex h-2.5 rounded-full overflow-hidden bg-slate-800" role="img" aria-label="Probabilités de victoire">
            <div id="bar-home" class="bg-red-600 transition-all" style="width:50%"></div>
            <div id="bar-away" class="bg-slate-400 transition-all" style="width:50%"></div>
          </div>
          <div class="grid grid-cols-3 gap-2 text-center">
            <div class="bg-slate-800/60 rounded-lg py-2 px-1">
              <div class="text-[10px] uppercase text-slate-400 font-bold tracking-wider">Buts attendus</div>
              <div id="pred-xg" class="font-display font-bold text-white text-lg leading-tight">—</div>
            </div>
            <div class="bg-slate-800/60 rounded-lg py-2 px-1">
              <div class="text-[10px] uppercase text-slate-400 font-bold tracking-wider">Over 5.5</div>
              <div id="pred-over55" class="font-display font-bold text-red-400 text-lg leading-tight">—</div>
            </div>
            <div class="bg-slate-800/60 rounded-lg py-2 px-1">
              <div class="text-[10px] uppercase text-slate-400 font-bold tracking-wider">Score probable</div>
              <div id="pred-score" class="font-display font-bold text-white text-lg leading-tight">—</div>
            </div>
          </div>
        </div>

        <div class="flex bg-slate-200 dark:bg-slate-900 p-1 rounded-xl border border-slate-200 dark:border-slate-800" role="tablist" aria-label="Type de statistique">
          <button id="tab-type-goals" class="flex-1 py-2.5 text-sm font-bold rounded-lg font-display uppercase tracking-wide bg-white dark:bg-slate-800 text-slate-900 dark:text-white shadow-sm" role="tab" aria-selected="true">🎯 Buteurs</button>
          <button id="tab-type-assists" class="flex-1 py-2.5 text-sm font-bold rounded-lg font-display uppercase tracking-wide text-slate-600 dark:text-slate-300" role="tab" aria-selected="false">🤝 Passeurs</button>
        </div>

        <div id="safe-top5" class="space-y-2"></div>
        <div id="players-container" class="space-y-3" aria-live="polite"></div>
        <div id="extra-data" class="space-y-3"></div>
      </div>
    </section>
  </div>

  <!-- Fenêtre Historique -->
  <div id="history-modal" class="fixed inset-0 bg-slate-950/70 backdrop-blur-sm hidden items-center justify-center p-2 sm:p-4 z-50">
    <section class="bg-slate-50 dark:bg-slate-950 w-full max-w-2xl rounded-2xl overflow-hidden shadow-2xl flex flex-col max-h-[94vh] border border-slate-200 dark:border-slate-800">
      <div class="p-4 bg-gradient-to-r from-slate-900 via-slate-800 to-slate-900 flex justify-between items-center gap-3">
        <div class="font-display font-bold text-xl sm:text-2xl text-white">📜 Historique</div>
        <button id="close-history" aria-label="Fermer" class="text-slate-400 hover:text-white text-3xl leading-none">&times;</button>
      </div>
      <div class="p-3 sm:p-4 flex-1 overflow-y-auto modal-scroll space-y-3">
        <div id="metrics-box"></div>
        <div id="history-list" class="space-y-2"></div>
      </div>
    </section>
  </div>

  <script>
    "use strict";

    const $ = (id) => document.getElementById(id);
    const datePicker = $("date-picker");

    let currentMatchData = null;
    let activeStatType = "goals";
    let selectedMatch = null;
    let matchesRequestController = null;
    let predictionRequestController = null;

    const today = new Date();
    const localDate = new Date(today.getTime() - today.getTimezoneOffset() * 60000)
      .toISOString()
      .slice(0, 10);

    datePicker.value = localDate;

    const TEAM_NAMES = {
      ANA: "Anaheim Ducks",
      BOS: "Boston Bruins",
      BUF: "Buffalo Sabres",
      CGY: "Calgary Flames",
      CAR: "Carolina Hurricanes",
      CHI: "Chicago Blackhawks",
      COL: "Colorado Avalanche",
      CBJ: "Columbus Blue Jackets",
      DAL: "Dallas Stars",
      DET: "Detroit Red Wings",
      EDM: "Edmonton Oilers",
      FLA: "Florida Panthers",
      LAK: "Los Angeles Kings",
      MIN: "Minnesota Wild",
      MTL: "Montréal Canadiens",
      NSH: "Nashville Predators",
      NJD: "New Jersey Devils",
      NYI: "New York Islanders",
      NYR: "New York Rangers",
      OTT: "Ottawa Senators",
      PHI: "Philadelphia Flyers",
      PIT: "Pittsburgh Penguins",
      SJS: "San Jose Sharks",
      SEA: "Seattle Kraken",
      STL: "St. Louis Blues",
      TBL: "Tampa Bay Lightning",
      TOR: "Toronto Maple Leafs",
      UTA: "Utah Mammoth",
      VAN: "Vancouver Canucks",
      VGK: "Vegas Golden Knights",
      WSH: "Washington Capitals",
      WPG: "Winnipeg Jets"
    };

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, (c) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      }[c]));
    }

    function normalizeText(value, fallback = "—") {
      const text = String(value ?? "").trim();
      return text.length ? text : fallback;
    }

    function setStatus(message, bad = false) {
      const el = $("api-status");
      el.textContent = message;
      el.className = "mb-4 text-xs text-center " + (bad ? "text-red-600 dark:text-red-400 font-semibold" : "text-slate-500 dark:text-slate-400");
    }

    function setRefreshBusy(isBusy) {
      const button = $("refresh-btn");
      if (!button) return;

      button.disabled = isBusy;
      button.textContent = isBusy ? "…" : "⟳";
      button.classList.toggle("opacity-50", isBusy);
      button.classList.toggle("cursor-not-allowed", isBusy);
    }

    function isValidNhlDate(dateStr) {
      if (!dateStr) return false;
      const d = new Date(dateStr + "T00:00:00");
      return !Number.isNaN(d.getTime());
    }

    function setStatTabState(type) {
      const goalsActive = type === "goals";
      const goalsBtn = $("tab-type-goals");
      const assistsBtn = $("tab-type-assists");

      goalsBtn.className = goalsActive
        ? "flex-1 py-2.5 text-sm font-bold rounded-lg font-display uppercase tracking-wide bg-white dark:bg-slate-800 text-slate-900 dark:text-white shadow-sm"
        : "flex-1 py-2.5 text-sm font-bold rounded-lg font-display uppercase tracking-wide text-slate-600 dark:text-slate-300";

      assistsBtn.className = !goalsActive
        ? "flex-1 py-2.5 text-sm font-bold rounded-lg font-display uppercase tracking-wide bg-white dark:bg-slate-800 text-slate-900 dark:text-white shadow-sm"
        : "flex-1 py-2.5 text-sm font-bold rounded-lg font-display uppercase tracking-wide text-slate-600 dark:text-slate-300";

      goalsBtn.setAttribute("aria-selected", String(goalsActive));
      assistsBtn.setAttribute("aria-selected", String(!goalsActive));
    }

    function openModal() {
      $("modal").classList.remove("hidden");
      $("modal").classList.add("flex");
      document.body.classList.add("overflow-hidden");
    }

    function closeModal() {
      $("modal").classList.add("hidden");
      $("modal").classList.remove("flex");
      document.body.classList.remove("overflow-hidden");
    }

    function openHistory() {
      $("history-modal").classList.remove("hidden");
      $("history-modal").classList.add("flex");
      document.body.classList.add("overflow-hidden");
      loadHistory();
    }

    function closeHistory() {
      $("history-modal").classList.add("hidden");
      $("history-modal").classList.remove("flex");
      document.body.classList.remove("overflow-hidden");
    }

    function teamLabel(name, abbr) {
      const safeName = String(name ?? "").trim();
      if (safeName.length > 3) return safeName;
      return TEAM_NAMES[abbr] || abbr || "";
    }

    function stateLabel(match) {
      const text = String(match.game_state || "NHL");
      const matchTime = text.match(/^([0-9]{2}):[0-9]{2}$/);
      if (matchTime && Number(matchTime[1]) < 7) return "🌙 " + text;
      return text;
    }

    function statusPillClasses(state) {
      const text = String(state || "").toLowerCase();
      if (/live|en cours|1st|2nd|3rd|p1|p2|p3/i.test(text)) {
        return "bg-red-600 text-white border-red-700";
      }
      if (/final|termin|fin\b/i.test(text)) {
        return "bg-slate-900 dark:bg-white text-white dark:text-slate-900 border-black dark:border-white";
      }
      return "bg-sky-100 dark:bg-sky-950 text-sky-800 dark:text-sky-300 border-sky-300 dark:border-sky-800";
    }

    function displayError(message) {
      $("safe-top5").innerHTML = "";
      $("players-container").innerHTML = `
        <div class="rounded-2xl border-2 border-red-200 dark:border-red-900 bg-red-50 dark:bg-red-950/40 p-6 text-center">
          <div class="text-4xl mb-2">⚠️</div>
          <div class="font-bold text-red-700 dark:text-red-300">${escapeHtml(message)}</div>
          <button id="retry-prediction" class="mt-4 rounded-lg bg-red-600 px-5 py-3 text-white font-bold hover:bg-red-700 transition">Réessayer</button>
        </div>
      `;

      const retryBtn = $("retry-prediction");
      if (retryBtn) {
        retryBtn.addEventListener("click", () => {
          if (selectedMatch) {
            fetchPrediction(selectedMatch.home_abbr, selectedMatch.away_abbr);
          }
        });
      }
    }

    function setupImageFallback(img, fallbackSrc) {
      if (!img) return;
      img.addEventListener("error", () => {
        img.src = fallbackSrc;
        img.onerror = null;
      });
    }

    function setModalLogos(match) {
      const homeImg = $("modal-home-logo");
      const awayImg = $("modal-away-logo");
      const homeWrap = $("modal-home-logo-wrap");
      const awayWrap = $("modal-away-logo-wrap");

      if (match && match.home_abbr) {
        homeImg.src = encodeURI(String(match.home_logo || `https://assets.nhle.com/logos/nhl/svg/${match.home_abbr}_light.svg`));
        awayImg.src = encodeURI(String(match.away_logo || `https://assets.nhle.com/logos/nhl/svg/${match.away_abbr}_light.svg`));
        homeWrap.classList.remove("hidden");
        awayWrap.classList.remove("hidden");
        setupImageFallback(homeImg, `https://assets.nhle.com/logos/nhl/svg/${match.home_abbr}_light.svg`);
        setupImageFallback(awayImg, `https://assets.nhle.com/logos/nhl/svg/${match.away_abbr}_light.svg`);
      } else {
        homeWrap.classList.add("hidden");
        awayWrap.classList.add("hidden");
      }
    }

    function resetPredictionModal(title = "Analyse du match") {
      $("modal-teams").textContent = title;
      ["pred-home-win", "pred-draw", "pred-away-win", "pred-xg", "pred-over55", "pred-score"].forEach((id) => {
        $(id).textContent = "…";
      });

      setWinBar(50, 50);
      $("players-container").innerHTML = `
        <div class="text-center py-12 text-slate-500 dark:text-slate-400">
          <div class="inline-block w-8 h-8 border-4 border-slate-200 dark:border-slate-800 border-t-red-600 rounded-full animate-spin"></div>
          <div class="mt-3 font-medium">Calcul des probabilités et récupération des statistiques NHL…</div>
        </div>`;
      $("extra-data").innerHTML = "";
      $("safe-top5").innerHTML = "";
      setOutcomeBanner(null);
    }

    function setWinBar(home, away) {
      const h = Number(home);
      const a = Number(away);
      const total = (h + a) || 100;

      $("bar-home").style.width = `${(h / total) * 100}%`;
      $("bar-away").style.width = `${(a / total) * 100}%`;
    }

    async function loadNhlMatches(date) {
      if (!isValidNhlDate(date)) {
        setStatus("Date invalide", true);
        return;
      }

      if (matchesRequestController) matchesRequestController.abort();

      matchesRequestController = new AbortController();

      $("loading").classList.remove("hidden");
      $("matches-container").innerHTML = "";
      $("no-matches").classList.add("hidden");
      setStatus("Récupération du calendrier NHL…");
      setRefreshBusy(true);

      try {
        const response = await fetch(`/api/matches/nhl?date=${encodeURIComponent(date)}`, {
          signal: matchesRequestController.signal
        });
        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.detail || `Erreur HTTP ${response.status}`);
        }

        $("loading").classList.add("hidden");

        if (!Array.isArray(data.matches) || data.matches.length === 0) {
          $("no-matches").textContent = "Aucun match NHL trouvé pour cette date.";
          $("no-matches").classList.remove("hidden");
        } else {
          data.matches.forEach(renderMatchCard);
        }

        setStatus(`${data.matches?.length ?? 0} match(s) trouvé(s) • Fuseau Europe/Paris`);
      } catch (err) {
        if (err.name === "AbortError") return;

        $("loading").classList.add("hidden");
        $("no-matches").textContent = `Impossible de charger le calendrier : ${escapeHtml(err.message)}`;
        $("no-matches").classList.remove("hidden");
        setStatus("Erreur de connexion à l'API", true);
      } finally {
        setRefreshBusy(false);
      }
    }

    function renderMatchCard(match) {
      const card = document.createElement("button");
      card.type = "button";
      card.className = "group w-full bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-4 sm:p-5 shadow-sm hover:shadow-xl hover:border-red-400 dark:hover:border-red-500 hover:-translate-y-0.5 transition-all text-left";

      const home = escapeHtml(teamLabel(match.home_team, match.home_abbr));
      const away = escapeHtml(teamLabel(match.away_team, match.away_abbr));

      const homeLogo = encodeURI(String(match.home_logo || `https://assets.nhle.com/logos/nhl/svg/${match.home_abbr}_light.svg`));
      const awayLogo = encodeURI(String(match.away_logo || `https://assets.nhle.com/logos/nhl/svg/${match.away_abbr}_light.svg`));
      const safeHomeFallback = `https://assets.nhle.com/logos/nhl/svg/${match.home_abbr || "nhl"}_light.svg`;
      const safeAwayFallback = `https://assets.nhle.com/logos/nhl/svg/${match.away_abbr || "nhl"}_light.svg`;

      card.innerHTML = `
        <div class="flex items-center justify-between gap-1 sm:gap-3">
          <div class="flex flex-col items-center gap-2 flex-1 min-w-0 text-center">
            <div class="w-20 h-20 sm:w-24 sm:h-24 rounded-full bg-sky-50 dark:bg-white border border-sky-100 dark:border-slate-300 flex items-center justify-center p-2 group-hover:scale-105 transition">
              <img src="${homeLogo}" alt="" class="w-14 h-14 sm:w-16 sm:h-16 object-contain" loading="lazy">
            </div>
            <span class="font-display font-bold text-slate-900 dark:text-white text-base sm:text-xl uppercase leading-tight break-words">${home}</span>
          </div>

          <div class="shrink-0 flex flex-col items-center gap-1.5 px-1">
            <div class="font-display text-2xl font-extrabold text-slate-300 dark:text-slate-600 leading-none">VS</div>
            <span class="text-xs px-2.5 py-1.5 rounded-full font-bold border whitespace-nowrap ${statusPillClasses(match.game_state)}">${escapeHtml(stateLabel(match))}</span>
            <div class="text-[10px] tracking-[0.15em] text-red-600 dark:text-red-400 font-bold uppercase flex items-center gap-1 mt-0.5">
              Analyser <span class="group-hover:translate-x-0.5 transition">→</span>
            </div>
          </div>

          <div class="flex flex-col items-center gap-2 flex-1 min-w-0 text-center">
            <div class="w-20 h-20 sm:w-24 sm:h-24 rounded-full bg-sky-50 dark:bg-white border border-sky-100 dark:border-slate-300 flex items-center justify-center p-2 group-hover:scale-105 transition">
              <img src="${awayLogo}" alt="" class="w-14 h-14 sm:w-16 sm:h-16 object-contain" loading="lazy">
            </div>
            <span class="font-display font-bold text-slate-900 dark:text-white text-base sm:text-xl uppercase leading-tight break-words">${away}</span>
          </div>
        </div>
      `;

      const homeImg = card.querySelectorAll("img")[0];
      const awayImg = card.querySelectorAll("img")[1];
      setupImageFallback(homeImg, safeHomeFallback);
      setupImageFallback(awayImg, safeAwayFallback);

      card.addEventListener("click", () => {
        if (!match.home_abbr || !match.away_abbr) {
          setStatus("Codes des équipes absents du calendrier.", true);
          return;
        }

        selectedMatch = match;
        fetchPrediction(match.home_abbr, match.away_abbr);
      });

      $("matches-container").appendChild(card);
    }

    function showPrediction(data) {
      currentMatchData = data;

      if (!data || typeof data !== "object") {
        displayError("Prédiction incomplète pour ce match.");
        return;
      }

      const p = data.match_prediction || {};
      const homeWin = normalizeText(p.home_win_pct_value, 50);
      const awayWin = normalizeText(p.away_win_pct_value, 50);

      setWinBar(homeWin, awayWin);
      $("pred-home-win").textContent = normalizeText(p.home_win_pct);
      $("pred-draw").textContent = normalizeText(p.draw_or_ot_pct);
      $("pred-away-win").textContent = normalizeText(p.away_win_pct);
      $("pred-xg").textContent = `${normalizeText(p.expected_goals_home)} - ${normalizeText(p.expected_goals_away)}`;
      $("pred-over55").textContent = normalizeText(p.over_5_5_goals_prob);
      $("pred-score").textContent = p.most_likely_score
        ? `${normalizeText(p.most_likely_score.home)} - ${normalizeText(p.most_likely_score.away)}`
        : "—";

      renderPlayers();
      renderExtraData();
    }

    async function fetchPrediction(homeTeam, awayTeam) {
      if (!homeTeam || !awayTeam || ["DOMICILE", "EXTERIEUR", "HOME", "AWAY"].includes(String(homeTeam).toUpperCase())) {
        openModal();
        displayError("Équipe non reconnue. Sélectionne un vrai match dans le calendrier.");
        return;
      }

      if (predictionRequestController) predictionRequestController.abort();
      predictionRequestController = new AbortController();

      activeStatType = "goals";
      currentMatchData = null;

      $("modal-teams").textContent = `${teamLabel(selectedMatch && selectedMatch.home_team, homeTeam)} vs ${teamLabel(selectedMatch && selectedMatch.away_team, awayTeam)}`;

      resetPredictionModal($("modal-teams").textContent);
      setModalLogos(selectedMatch);

      setStatTabState("goals");
      openModal();

      try {
        const response = await fetch("/predict/goalscorers", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            league: "NHL",
            home_team: homeTeam,
            away_team: awayTeam
          }),
          signal: predictionRequestController.signal
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.detail || `Erreur HTTP ${response.status}`);
        }

        if (!data || !data.match_prediction) {
          throw new Error("Prédiction incomplète pour ce match.");
        }

        showPrediction(data);
      } catch (err) {
        if (err.name === "AbortError") return;
        displayError(err.message || "Erreur lors de la récupération des données.");
      }
    }
