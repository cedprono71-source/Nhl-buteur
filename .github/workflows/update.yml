name: Mise a jour NHL

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Evaluer les resultats via Vercel
        run: curl -fsS --max-time 60 "https://nhl-buteur-4xc3.vercel.app/api/evaluate?limit=100"
        continue-on-error: true
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -c "import main; main.run_cron_job()"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
